version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: trippilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: trippilot
      MYSQL_USER: trippilot_user
      MYSQL_PASSWORD: trippilot_password_change_me
      MYSQL_ALLOW_EMPTY_PASSWORD: "false"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trippilot-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trippilot-backend
    environment:
      DATABASE_URL: mysql+pymysql://trippilot_user:trippilot_password_change_me@mysql:3306/trippilot
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - trippilot-network
    restart: unless-stopped

  # Frontend CRM
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trippilot-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trippilot-network
    restart: unless-stopped

  # Admin Portal
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: trippilot-admin
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks:
      - trippilot-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  trippilot-network:
    driver: bridge
