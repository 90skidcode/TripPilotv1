
services:
  api:
    build: .
    container_name: trippilot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # API keys (GEMINI_API_KEY, GOOGLE_PLACES_API_KEY, …) come from .env via
      # env_file above — only compose-specific overrides belong here.
      DATABASE_URL: postgresql://trippilot:trippilot123@db:5432/trippilot
      SECRET_KEY: "trippilot-super-secret-jwt-key-change-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    depends_on:
      db:
        condition: service_healthy 
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: trippilot_db
    environment:
      POSTGRES_DB: trippilot
      POSTGRES_USER: trippilot
      POSTGRES_PASSWORD: trippilot123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trippilot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trippilot.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
